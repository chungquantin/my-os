<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vaultd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root{
  --ground:#faf8f8; --surface:#ffffff; --sunk:#f2eeee;
  --rule:#e5e5e5; --rule-soft:#efebeb; --gray:#b8b8b8; --muted:#4e4e4e; --ink:#2b2b2b;
  --accent:#284b63; --accent-soft:rgba(40,75,99,.09); --accent-line:rgba(40,75,99,.3);
  --support:#84a59d; --support-soft:rgba(132,165,157,.18);
  --ok:#3f7d5f; --ok-soft:rgba(63,125,95,.11);
  --warn:#a8761f; --warn-soft:rgba(168,118,31,.12);
  --crit:#a33a2e; --crit-soft:rgba(163,58,46,.1);
  --mark:rgba(255,231,120,.55); --mark-line:#d8a72a;
  --bezel:#d9d4d4;
  --graph-dim:#cbc5c5; --graph-edge:#ded8d8;
  --shadow:0 1px 2px rgba(43,43,43,.05), 0 14px 34px rgba(43,43,43,.09);
  --display:"Schibsted Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --body:"Source Sans 3","Source Sans Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#161618; --surface:#1e1e21; --sunk:#242427;
    --rule:#393639; --rule-soft:#2c2a2c; --gray:#646464; --muted:#a2a2a4; --ink:#ebebec;
    --accent:#7b97aa; --accent-soft:rgba(123,151,170,.15); --accent-line:rgba(123,151,170,.42);
    --support:#84a59d; --support-soft:rgba(132,165,157,.18);
    --ok:#79b394; --ok-soft:rgba(121,179,148,.14);
    --warn:#d0a256; --warn-soft:rgba(208,162,86,.15);
    --crit:#d3796c; --crit-soft:rgba(211,121,108,.14);
    --mark:rgba(214,168,42,.3); --mark-line:#d0a256;
    --bezel:#39363b;
    --graph-dim:#4d4a4e; --graph-edge:#3b383c;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 38px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#161618; --surface:#1e1e21; --sunk:#242427;
  --rule:#393639; --rule-soft:#2c2a2c; --gray:#646464; --muted:#a2a2a4; --ink:#ebebec;
  --accent:#7b97aa; --accent-soft:rgba(123,151,170,.15); --accent-line:rgba(123,151,170,.42);
  --support:#84a59d; --support-soft:rgba(132,165,157,.18);
  --ok:#79b394; --ok-soft:rgba(121,179,148,.14);
  --warn:#d0a256; --warn-soft:rgba(208,162,86,.15);
  --crit:#d3796c; --crit-soft:rgba(211,121,108,.14);
  --mark:rgba(214,168,42,.3); --mark-line:#d0a256;
  --bezel:#39363b;
  --graph-dim:#4d4a4e; --graph-edge:#3b383c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 38px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
[hidden]{display:none!important}
button{font-family:var(--body)}

/* ---------- page ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:32px 22px 60px}
.masthead{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px 14px;margin-bottom:6px}
.wordmark{font-family:var(--mono);font-size:20px;font-weight:500;letter-spacing:-.01em}
.wordmark .dim{color:var(--gray)}
.kicker{font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.deck{max-width:64ch;color:var(--muted);font-size:15.5px;margin:0 0 18px}
.deck b{color:var(--ink);font-weight:600}
.viewpick{display:inline-flex;background:var(--sunk);border:1px solid var(--rule);border-radius:11px;padding:3px;gap:3px;margin-bottom:24px}
.viewpick button{font-size:13.5px;font-weight:600;color:var(--muted);background:none;border:0;border-radius:8px;padding:8px 15px;cursor:pointer}
.viewpick button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:46px;align-items:start}
@media (max-width:920px){.stage{grid-template-columns:minmax(0,1fr);gap:24px}
  .notes-col{order:2}.phone-col{order:1}}

/* ---------- side notes ---------- */
.nhead{font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--gray);margin:0 0 13px}
.nlist{display:flex;flex-direction:column;gap:14px;margin:0 0 22px;padding:0;list-style:none}
.nlist li{border-left:2px solid var(--rule);padding-left:14px}
.nlist li.hi{border-left-color:var(--support)}
.nlist b{display:block;font-size:14px;letter-spacing:-.005em;margin-bottom:2px}
.nlist span{font-size:13.5px;color:var(--muted);line-height:1.5}
.nlist code{font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.rail{display:flex;flex-direction:column;gap:2px;list-style:none;padding:0;margin:0}
.rail button{width:100%;display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;align-items:start;text-align:left;background:none;border:0;padding:10px 11px;border-radius:9px;cursor:pointer;color:inherit;font-size:14.5px}
.rail button:hover{background:var(--accent-soft)}
.rail .num{font-family:var(--mono);font-size:11px;line-height:21px;height:21px;border-radius:50%;text-align:center;border:1px solid var(--rule);color:var(--gray);background:var(--surface)}
.rail .rt{font-weight:600;display:block}
.rail .rd{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
.rail li[data-state="done"] .num{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.rail li[data-state="skip"] .num{background:var(--sunk);border-color:transparent;color:var(--gray)}
.rail li[data-state="now"] button{background:var(--accent-soft)}
.rail li[data-state="now"] .num{background:var(--accent);border-color:transparent;color:var(--surface)}
.rail li[data-state="now"] .rt{color:var(--accent)}
.rail li[data-opt="1"] .rt::after{content:"optional";font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--gray);margin-left:7px}

/* ---------- phone ---------- */
.phone{width:100%;max-width:392px;margin:0 auto;background:var(--bezel);border-radius:40px;padding:11px;box-shadow:var(--shadow)}
.screen{background:var(--surface);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;height:736px;position:relative}
@media (max-width:560px){
  .wrap{padding:22px 0 44px}
  .masthead,.deck,.viewpick,.notes-col,.foot{margin-left:18px;margin-right:18px}
  .phone{padding:0;border-radius:0;box-shadow:none;max-width:none;background:transparent}
  .screen{border-radius:0;height:680px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 4px;font-size:12px;font-weight:600;color:var(--ink);flex:0 0 auto}
.statusbar .rt{display:flex;gap:5px;align-items:center;color:var(--muted);font-weight:400;font-size:11px}

/* nav bars */
.navbar{display:flex;align-items:center;gap:10px;padding:8px 14px 12px;flex:0 0 auto;border-bottom:1px solid var(--rule-soft)}
.navbar .back{background:none;border:0;color:var(--accent);font-size:14.5px;font-weight:600;cursor:pointer;padding:4px 2px;display:flex;align-items:center;gap:4px}
.navbar h2{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.015em;margin:0;flex:1;text-align:center;padding-right:44px;line-height:1.2}
.navbar .icon{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:4px}
.bighead{padding:6px 20px 12px;flex:0 0 auto}
.bighead h1{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.022em;margin:0 0 3px;line-height:1.14}
.bighead p{margin:0;font-size:13.5px;color:var(--muted)}
.vpick{display:flex;align-items:center;gap:7px;background:var(--sunk);border:1px solid var(--rule);border-radius:999px;padding:5px 12px;cursor:pointer;color:inherit;font-size:13px;font-weight:600}
.vpick .caret{color:var(--gray);font-size:9px}

.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:14px 18px 18px;display:flex;flex-direction:column;gap:14px}

/* tab bar */
.tabbar{display:flex;border-top:1px solid var(--rule);background:var(--surface);flex:0 0 auto;padding-bottom:env(safe-area-inset-bottom,0)}
.tabbar button{flex:1;background:none;border:0;padding:9px 4px 12px;cursor:pointer;color:var(--gray);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabbar .tl{font-size:10.5px;font-weight:600;letter-spacing:.01em}
.tabbar button[aria-current="true"]{color:var(--accent)}
.tabbar .bdg{position:absolute;top:5px;left:calc(50% + 6px);background:var(--crit);color:#fff;font-size:9.5px;font-weight:700;border-radius:999px;padding:1px 5px;line-height:1.4}

/* ---------- chat ---------- */
.thread{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;flex-direction:column;max-width:88%}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.ai{align-self:stretch;max-width:100%}
.bub{background:var(--sunk);border-radius:16px;padding:10px 13px;font-size:14.5px;line-height:1.5}
.msg.me .bub{background:var(--accent);color:var(--ground);border-bottom-right-radius:6px}
.stamp{font-size:10.5px;color:var(--gray);margin-top:4px;padding:0 4px}
.wave{display:flex;align-items:center;gap:9px}
.wave .play{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.22);color:var(--ground);border:0;display:flex;align-items:center;justify-content:center;font-size:9px;flex:0 0 auto;cursor:pointer}
.wave .bars{display:flex;align-items:center;gap:2px;height:22px}
.wave .bars i{width:2.5px;border-radius:2px;background:var(--ground);opacity:.75;display:block}
.wave .dur{font-size:12.5px;opacity:.85}
.shot{display:flex;gap:9px;align-items:center}
.shot .ph{width:52px;height:42px;border-radius:8px;flex:0 0 auto;background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,.12));display:flex;align-items:center;justify-content:center;font-size:16px}
.askchip{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.24);border-radius:999px;padding:2px 8px;align-self:flex-start;margin-bottom:6px;display:inline-block}

.card{border:1px solid var(--rule);border-radius:15px;background:var(--surface);padding:13px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(43,43,43,.04)}
.card .ct{font-family:var(--display);font-size:16.5px;font-weight:700;letter-spacing:-.014em;line-height:1.25}
.card .cs{font-size:13px;color:var(--muted);line-height:1.45}
.card.kept{border-color:var(--ok-soft);background:var(--ok-soft)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--support-soft);color:var(--support);font-weight:600}
.tag.plain{background:var(--sunk);color:var(--muted);font-weight:400}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.acts{display:flex;gap:8px;align-items:center}
.acts .sp{flex:1}
.btn{font-size:14px;font-weight:600;border-radius:10px;padding:10px 15px;cursor:pointer;border:1px solid transparent;background:var(--sunk);color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--ground)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{font-size:13px;padding:7px 12px;border-radius:9px}
.btn.line{background:var(--surface);border-color:var(--rule)}
.btn.wide{width:100%;justify-content:center;text-align:center}
.btn.dan{background:var(--surface);border-color:var(--rule);color:var(--crit)}

.ans{font-size:14.5px;line-height:1.58;margin:0}
.ans sup{font-family:var(--mono);font-size:10px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 4px;margin-left:2px;vertical-align:super;cursor:pointer}
.caveat{display:flex;gap:8px;font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:9px 11px;line-height:1.45}
.srcs{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--rule-soft);padding-top:10px}
.srcs .sl{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray)}
.src{display:flex;gap:9px;align-items:center;background:var(--sunk);border:0;border-radius:10px;padding:9px 11px;cursor:pointer;text-align:left;width:100%;color:inherit}
.src:hover{background:var(--accent-soft)}
.src .n{width:19px;height:19px;border-radius:50%;background:var(--accent);color:var(--ground);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.src .st{font-size:13.5px;font-weight:600;line-height:1.25;flex:1;min-width:0}
.src .sq{font-size:11.5px;color:var(--muted);display:block;font-weight:400;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src .go{color:var(--gray);font-size:13px;flex:0 0 auto}

.steps{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.steps div{display:flex;gap:9px;align-items:center}
.steps .on{color:var(--ink);font-weight:600}
.steps .pend{color:var(--gray)}

.modebar{display:flex;align-items:center;gap:9px;padding:9px 16px 0;flex:0 0 auto}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{font-size:13px;font-weight:600;color:var(--muted);background:none;border:0;border-radius:8px;padding:6px 15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.09)}
.modebar .mh{font-size:11.5px;color:var(--gray);flex:1;text-align:right}
.composer{padding:10px 14px calc(12px + env(safe-area-inset-bottom,0));display:flex;gap:8px;align-items:center;flex:0 0 auto;border-top:1px solid var(--rule-soft)}
.cin{flex:1;background:var(--sunk);border-radius:22px;padding:12px 16px;font-size:14.5px;color:var(--gray);min-height:44px}
.cbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--sunk);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.cbtn.go{background:var(--accent);color:var(--ground)}
.cbtn.rec{background:var(--crit);color:#fff}
.recbar{flex:1;display:flex;align-items:center;gap:10px;background:var(--crit-soft);border-radius:22px;padding:12px 16px;min-height:44px}
.recbar .rd{width:9px;height:9px;border-radius:50%;background:var(--crit);flex:0 0 auto}
.recbar .rt{font-size:13.5px;color:var(--crit);font-weight:600}
.recbar .rw{display:flex;align-items:center;gap:2px;height:18px;flex:1}
.recbar .rw i{width:2.5px;border-radius:2px;background:var(--crit);opacity:.55;display:block}

/* ---------- lists ---------- */
.rowbtn{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule-soft);padding:13px 18px;cursor:pointer;color:inherit}
.rowbtn:hover{background:var(--sunk)}
.rowbtn .ic{width:34px;height:34px;border-radius:10px;background:var(--sunk);display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:15px}
.rowbtn .rt{font-size:14.5px;font-weight:600;line-height:1.28;display:block;letter-spacing:-.005em}
.rowbtn .rm{font-size:12.5px;color:var(--muted);display:block;margin-top:1px}
.rowbtn .go{color:var(--gray);font-size:14px;flex:0 0 auto}
.pill{font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap;flex:0 0 auto}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--crit-soft);color:var(--crit)}
.sectlab{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);padding:16px 18px 7px}

/* ---------- note reader ---------- */
.jump{display:flex;align-items:center;gap:10px;background:var(--accent-soft);padding:10px 18px;flex:0 0 auto;font-size:13px;color:var(--accent);font-weight:600}
.jump .sp{flex:1}
.jump button{width:30px;height:30px;border-radius:8px;border:1px solid var(--accent-line);background:var(--surface);color:var(--accent);cursor:pointer;font-size:12px}
.note{padding:16px 18px 8px;font-size:15px;line-height:1.62}
.note h1{font-family:var(--display);font-size:23px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px;line-height:1.16}
.note .meta{font-size:12.5px;color:var(--muted);margin:0 0 16px}
.note h2{font-family:var(--display);font-size:16px;font-weight:700;margin:20px 0 6px;letter-spacing:-.01em}
.note p{margin:0 0 12px}
.note ul{margin:0 0 12px;padding-left:20px}
.note li{margin-bottom:5px}
.note mark{background:var(--mark);border-bottom:2px solid var(--mark-line);border-radius:2px;padding:1px 0;color:inherit}
.note mark.active{background:var(--mark);outline:2px solid var(--mark-line);outline-offset:2px;border-radius:3px}
.note a.wl{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-line)}
.relhead{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);padding:8px 18px 6px}
.relnote{font-size:12.5px;color:var(--muted);padding:0 18px 10px;line-height:1.45}

/* ---------- graph ---------- */
.gwrap{padding:6px 12px 0}
.gwrap svg{display:block;width:100%;height:auto}
.gedge{stroke:var(--graph-edge);stroke-width:1.1}
.gedge.new{stroke:var(--support);stroke-width:2}
.gnode{fill:var(--graph-dim)}
.gnode.new{fill:var(--support);stroke:var(--surface);stroke-width:2.5}
.gnode.orphan{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:3.5 2.5}
.glabel{fill:var(--gray);font-family:"IBM Plex Mono",monospace;font-size:8.5px;text-anchor:middle}
.glabel.new{fill:var(--support);font-size:9.6px;font-weight:500}
.glabel.orphan{fill:var(--warn)}
.gstat{display:flex;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin:0 18px}
.gstat div{flex:1;background:var(--surface);padding:9px 6px;text-align:center}
.gstat .v{font-family:var(--mono);font-size:17px;font-weight:500;letter-spacing:-.02em}
.gstat .v.up{color:var(--support)}
.gstat .v.bad{color:var(--warn)}
.gstat .l{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--gray);margin-top:1px}
.note-warn{display:flex;gap:9px;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.45;margin:0 18px}
.note-warn b{font-weight:600}

/* ---------- settings ---------- */
.grp{border:1px solid var(--rule);border-radius:14px;overflow:hidden;background:var(--surface)}
.grp .rowbtn{border-bottom:1px solid var(--rule-soft);padding:12px 14px}
.grp .rowbtn:last-child{border-bottom:0}
.grp .val{font-size:13px;color:var(--muted);flex:0 0 auto;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{font-size:12.5px;color:var(--muted);line-height:1.48;margin:0}
.hint b{color:var(--ink)}
.hint code,.mono{font-family:var(--mono);font-size:12px}
.disc{border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.disc summary{list-style:none;cursor:pointer;padding:11px 13px;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.disc summary::-webkit-details-marker{display:none}
.disc[open] summary{color:var(--accent);border-bottom:1px solid var(--rule-soft)}
.disc .dc{padding:12px 13px;font-family:var(--mono);font-size:11.5px;line-height:1.7;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.disc .dc .add{color:var(--ok)}

/* ---------- setup screens ---------- */
.sbody{padding:14px 18px 12px;display:flex;flex-direction:column;gap:14px;flex:1;overflow-y:auto}
.sfoot{padding:12px 18px calc(16px + env(safe-area-inset-bottom,0));border-top:1px solid var(--rule-soft);display:flex;gap:9px;align-items:center;flex:0 0 auto}
.dots{display:flex;gap:5px;margin-right:auto}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--rule);display:block}

    + '</div>';
}

/* ---- graph ---- */
function scGraph(){
  var s='<svg viewBox="0 0 360 440" role="img" aria-label="Your notes and how they connect">';
  E.forEach(function(e){s+='<line class="gedge" x1="'+N[e[0]].x+'" y1="'+N[e[0]].y+'" x2="'+N[e[1]].x+'" y2="'+N[e[1]].y+'"/>';});
  NEWN.forEach(function(n){n.to.forEach(function(i){
    s+='<line class="gedge new" x1="'+n.x+'" y1="'+n.y+'" x2="'+N[i].x+'" y2="'+N[i].y+'"/>';});});
  N.forEach(function(n){s+='<circle class="gnode" cx="'+n.x+'" cy="'+n.y+'" r="'+n.r+'"/>'
    +'<text class="glabel" x="'+n.x+'" y="'+(n.y+n.r+11)+'">'+esc(n.l)+'</text>';});
  NEWN.forEach(function(n){s+='<circle class="gnode '+(n.orphan?'orphan':'new')+'" cx="'+n.x+'" cy="'+n.y+'" r="'+n.r+'"/>'
    +'<text class="glabel '+(n.orphan?'orphan':'new')+'" x="'+n.x+'" y="'+(n.y+n.r+12)+'">'+esc(n.l)+'</text>';});
  s+='</svg>';

  return statusbar()
    + '<div class="bighead"><h1>Graph</h1><p>16 notes. 3 added this week.</p></div>'
    + '<div class="body"><div class="gwrap">'+s+'</div>'
    + '<div class="gstat"><div><div class="v">16</div><div class="l">Notes</div></div>'
    +   '<div><div class="v up">+3</div><div class="l">This week</div></div>'
    +   '<div><div class="v bad">1</div><div class="l">Not linked</div></div></div>'
    + '<div style="height:14px"></div>'
    + '<div class="note-warn"><span>⚠</span><span><b>Colocation pricing</b> connects to nothing. '
    +   'It probably belongs under a note you haven&#39;t written yet.</span></div>'
    + '<p class="hint" style="padding:16px 18px 24px">Green is new this week. '
    +   'Tap a dot to open the note.</p></div>'

}

/* =================== setup =================== */

var GH='<svg width="19" height="19" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>';

function head(n,t,p){return '<div style="padding:4px 18px 12px;border-bottom:1px solid var(--rule-soft);flex:0 0 auto">'

}
function p2(){return head(2,'Pick a vault','A vault is one GitHub repository. You can have more than one and switch between them.')

  + '<button class="vrow" type="button"><span class="vi">◈</span><span style="min-width:0">'

  + '<button class="vrow" type="button" aria-pressed="true"><span class="vi">+</span><span style="min-width:0">'

  + '<div class="sbody"><div class="tree"><span class="d">Start</span>\n<span class="h">Inbox</span>          <span class="c">← new notes land here</span>\n'
  + '<span class="d">Foundations</span>\n<span class="d">Deep Dives</span>\n<span class="d">Data and Research</span></div>'
  + '<div class="lockline"><span class="tx">Also make a plain website</span>'

function p4(){return head(4,'Choose the AI','Four jobs. Each can use a cloud model or one running on your own machine.')
  + '<div class="sbody"><div class="grp">'
  + row('🎧','Hearing you','On your Mac')
  + row('🖼','Reading images','claude-sonnet-5')
  + row('🧠','Writing notes','claude-opus-5')
  + row('💬','Answering','claude-sonnet-5')
  + '</div>'
  + '<div class="row ok"><span class="mk">✓</span><span>Voice stays on your Mac — nothing leaves your network</span></div>'
  + '<p class="hint">Voice is the most personal thing you&#39;ll send, so it defaults to your own machine if you have one running.</p>'
  + '<div class="row"><span class="mk">≈</span><span>About <b>half a cent</b> per voice note</span></div></div>';}
function p5(){return head(5,'Ways to capture','Capture is already built in. Talk, type, or send a photo — nothing to set up.')
  + '<div class="sbody"><div class="row ok"><span class="mk">✓</span><span><b>In the app</b> · ready now</span></div>'
  + '<p class="hint">Add it to your home screen and it records voice and takes photos like any other app.</p>'
  + '<div class="orline">optional</div>'
  + '<button class="vrow" type="button"><span class="vi">✈</span><span style="min-width:0"><span class="vn">Telegram</span>'
  +   '<span class="vm">Capture from your lock screen</span></span><span class="vb">add</span></button>'
  + '<button class="vrow" type="button"><span class="vi">✉</span><span style="min-width:0"><span class="vn">Email</span>'

  + '<p class="hint">You can add these any time. Skipping costs you nothing.</p></div>';}

  + '<div class="sbody"><div class="term" id="term"></div><div class="bar"><i id="bar"></i></div>'
  + '<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted)">'
  + '<span id="bs">Setting up…</span><span class="mono" id="bn">0 / 31</span></div></div>';}
function p7(){
  if(testState==='input') return head(7,'Try it','Say something you&#39;d actually want to remember. Nothing is saved until you approve it.')
    + '<div class="sbody"><div class="mic"><button class="micbtn" type="button" data-test="run" aria-label="Record">'
    + icon(IC.mic,34)+'</button><p class="miclab"><b>Hold to record</b><br>or tap to use a sample</p></div>'

  return head(7,'Here&#39;s what it made','Check it, then keep it or throw it away.')
    + '<div class="sbody"><div class="card"><span class="ct">FPGA timing closure notes</span>'
    + '<span class="cs">Timing closure keeps failing on the market-data parser path. The critical path runs through the checksum stage.</span>'

}
function p8(){return head(8,'You&#39;re set','Your vault is live and ready.')
  + '<div class="sbody"><div style="display:flex;gap:13px;align-items:center">'
  + '<div class="done-mark">✓</div><div><div style="font-weight:600">second-brain</div>'
  + '<div class="hint">31 files · private</div></div></div>'
  + '<div class="row ok"><span class="mk">✓</span><span>'+(testSkipped?'Nothing waiting yet':'<b>1 note</b> waiting in Review')+'</span></div>'
  + '<button class="btn pri wide" type="button" data-go2app="1" style="padding:14px">Start capturing</button>'
  + '<p class="hint" style="text-align:center">Add this to your home screen for one-tap voice capture.</p></div>';}

var P=[p1,p2,p3,p4,p5,p6,p7,p8];

var BUILD=[['g','$ setting up second-brain'],['a','▸ create repository            private'],
 ['','▸ add folders'],['','▸ add Inbox'],['','▸ add Obsidian settings'],['','▸ add website template'],
 ['a','▸ save 31 files                a1b2c3d'],['a','▸ turn on capture              ok'],
 ['a','▸ build connections            ok'],['s','✓ ready in 7.4s']];
var DL=[['📥','Got it','0.0s'],['🎧','Listening to your note','1.4s'],['🧠','Writing it up','3.1s'],
 ['🔗','Finding what it connects to','3.4s'],['📄','Ready for you','3.5s']];

function runBuild(){
  var t=document.getElementById('term'),b=document.getElementById('bar'),
      st=document.getElementById('bs'),nu=document.getElementById('bn');
  if(!t)return; t.textContent='';
  function line(i){var d=document.createElement('div');if(BUILD[i][0])d.className=BUILD[i][0];
    d.textContent=BUILD[i][1];t.appendChild(d);t.scrollTop=t.scrollHeight;
    b.style.width=Math.round(((i+1)/BUILD.length)*100)+'%';
    nu.textContent=Math.min(31,Math.round(31*(i+1)/BUILD.length))+' / 31';
    if(i===BUILD.length-1)st.textContent='Done';}
  if(reduced()){for(var k=0;k<BUILD.length;k++)line(k);return;}
  for(var i=0;i<BUILD.length;i++)(function(i){timers.push(setTimeout(function(){line(i);},90+i*190));})(i);
}
function runDraft(){
  var el=document.getElementById('draft');if(!el)return;el.textContent='';
  function line(i){var last=i===DL.length-1,d=document.createElement('div');
    d.innerHTML='<span>'+DL[i][0]+'</span><span class="'+(last?'now':'')+'" style="flex:1">'+DL[i][1]+'</span>'
      +'<span class="mono" style="font-size:11px;color:var(--gray)">'+DL[i][2]+'</span>';
    el.appendChild(d);}
  if(reduced()){for(var k=0;k<DL.length;k++)line(k);testState='result';render();return;}
  for(var i=0;i<DL.length;i++)(function(i){timers.push(setTimeout(function(){line(i);},260+i*440));})(i);
  timers.push(setTimeout(function(){testState='result';render();},260+DL.length*440+340));
}
function sfoot(){
  var dots='';for(var i=0;i<8;i++)dots+='<i class="'+(i===cur?'on':'')+'"></i>';
  var l='',r='';
  if(cur===6){
    if(testState==='input'){l='<button class="btn" type="button" data-skip="1">Skip</button>';
      r='<button class="btn pri" style="flex:1" type="button" data-test="run">Try it</button>';}
    else if(testState==='running'){r='<button class="btn" style="flex:1" type="button" disabled>Working…</button>';}
    else{l='<button class="btn dan" type="button" data-test="reset">Throw away</button>';
      r='<button class="btn pri" style="flex:1" type="button" data-go="7">Keep it</button>';}
  }else{
    var last=cur===7;
    l=cur>0?'<button class="btn" type="button" data-go="'+(cur-1)+'">Back</button>':'';
    r='<button class="btn pri" style="flex:1" type="button" data-go="'+(last?0:cur+1)+'">'
      +(last?'Start over':cur===5?'Try it':'Continue')+'</button>';
  }
  return '<div class="sfoot"><div class="dots">'+dots+'</div>'+l+r+'</div>';
}

/* =================== shell =================== */

var DECK={
  app:'Mobile first — this is the PWA, and later the iOS app. Plain language on the surface, '
     + 'technical detail one tap down. <b>Tap a source under an answer</b> to jump into the note with the exact lines highlighted.',
  setup:'Eight screens from a GitHub account to a working vault. No jargon, and two of them are skippable.'
};
var FOOT={
  app:'Example data. Highlights, related notes and the graph all come from links you wrote — nothing is inferred.',
  setup:'Example data, not live credentials.'
};

function sideNotes(){
  if(view==='setup'){
    return '<p class="nhead">First run</p><ul class="rail" id="rail"></ul>';
  }
  return '<p class="nhead">What changed in this pass</p><ul class="nlist">'
   + '<li class="hi"><b>Citations open the note</b><span>Tap a source under an answer and it pushes to the note, '
   + 'scrolled to the exact sentence, highlighted. Two passages, with jump arrows between them. '
   + 'Requires span-level provenance: the model quotes, the server locates the quote, and if it can&#39;t find it '
   + 'you get the note without a highlight rather than a wrong one.</span></li>'
   + '<li class="hi"><b>Related notes, not recommendations</b><span>Ranked from outbound links, inbound links, '
   + 'then shared tags — every row says which. Nothing is guessed.</span></li>'
   + '<li><b>Plain words everywhere</b><span>Promote → <b>Keep</b>. Staged → <b>Waiting</b>. '
   + 'Orphan → <b>Not linked</b>. Diff → a readable <b>Preview</b>. Repository, commit SHA and frontmatter '
   + 'live behind <code>⚙ Technical details</code>.</span></li>'
   + '<li><b>Thumb reach</b><span>Bottom tab bar, 44px targets, back at top-left, destructive action '
   + 'furthest from the thumb. Composer sits above the tab bar with the mic beside send.</span></li>'
   + '<li><b>Portrait graph</b><span>Re-laid out for a narrow screen with readable labels, not a desktop '
   + 'graph squeezed sideways.</span></li></ul>';
}

function render(){
  clearTimers();
  var sc=document.getElementById('screen');
  if(view==='setup'){ sc.innerHTML = statusbar() + P[cur]() + sfoot();
    if(cur===5)runBuild(); if(cur===6&&testState==='running')runDraft();
  } else if(pushed && pushed.k==='note'){ sc.innerHTML = scNote(pushed.id);
  } else if(pushed && pushed.k==='draft'){ sc.innerHTML = scDraft(pushed.id);
  } else { sc.innerHTML = tab==='chat'?scChat(): tab==='review'?scReview(): tab==='graph'?scGraph(): scMore(); }

  var b=sc.querySelector('.body'), th=sc.querySelector('.thread');
  if(th&&b) b.scrollTop=b.scrollHeight;
  var act=sc.querySelector('mark.active');
  if(act&&b) b.scrollTop=Math.max(0,act.offsetTop-150);

  var rail=document.getElementById('rail');
  if(rail){
    Array.prototype.forEach.call(rail.children,function(li,i){
      var st=i<cur?(i===6&&testSkipped?'skip':'done'):i===cur?'now':'todo';
      li.dataset.state=st;
      li.querySelector('.num').textContent=st==='done'?'✓':st==='skip'?'–':(i+1);
    });
  }
}

function buildRail(){
  var rail=document.getElementById('rail'); if(!rail)return;
  STEPS.forEach(function(s,i){
    var li=document.createElement('li'); if(s.opt)li.dataset.opt='1';
    li.innerHTML='<button type="button"><span class="num">'+(i+1)+'</span><span><span class="rt">'+s.t
      +'</span><span class="rd">'+s.d+'</span></span></button>';
    li.querySelector('button').addEventListener('click',function(){cur=i;render();});
    rail.appendChild(li);
  });
}

function setView(v){
  view=v; pushed=null;
  document.getElementById('deck').innerHTML=DECK[v];
  document.getElementById('foot').textContent=FOOT[v];
  document.getElementById('wm').textContent=v==='app'?'://app':'://first-run';
  Array.prototype.forEach.call(document.querySelectorAll('.viewpick button'),function(b){
    b.setAttribute('aria-pressed',b.dataset.view===v);});
  document.getElementById('notes').innerHTML=sideNotes();
  if(v==='setup')buildRail();
  render();
}

document.querySelector('.viewpick').addEventListener('click',function(e){
  var b=e.target.closest('[data-view]'); if(b)setView(b.dataset.view);
});

document.getElementById('screen').addEventListener('click',function(e){
  var t=e.target, x;
  if((x=t.closest('[data-open]'))){ pushed={k:'note',id:x.dataset.open};
    if(x.dataset.h) hl=parseInt(x.dataset.h,10); render(); return; }
  if((x=t.closest('[data-hl]'))){ hl=parseInt(x.dataset.hl,10); render(); return; }
  if((x=t.closest('[data-draft]'))){ pushed={k:'draft',id:x.dataset.draft}; render(); return; }
  if((x=t.closest('[data-back]'))){ pushed=null; render(); return; }
  if((x=t.closest('[data-tab]'))){ tab=x.dataset.tab; pushed=null; render(); return; }
  if((x=t.closest('[data-mode]'))){ chatMode=x.dataset.mode; render(); return; }
  if((x=t.closest('[data-rec]'))){ recording=x.dataset.rec==='1'; render(); return; }
  if((x=t.closest('[data-auth]'))){ authed=x.dataset.auth==='1'; render(); return; }
  if((x=t.closest('[data-test]'))){ testState=x.dataset.test==='run'?'running':'input';
    if(x.dataset.test==='run')testSkipped=false; render(); return; }
  if((x=t.closest('[data-skip]'))){ testSkipped=true; testState='input'; cur=7; render(); return; }
  if((x=t.closest('[data-go2app]'))){ tab='chat'; setView('app'); return; }
  if((x=t.closest('[data-go]'))){
    if(x.dataset.go==='7'&&cur===6)testSkipped=false;
    cur=parseInt(x.dataset.go,10);
    if(cur===0){testState='input';testSkipped=false;authed=false;}
    render(); return; }
  if((x=t.closest('.switch'))&&!x.disabled){
    x.setAttribute('aria-checked',x.getAttribute('aria-checked')==='true'?'false':'true'); }
});

setView('app');
})();
</script>
